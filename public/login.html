<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090B14"><title>Sign in — AKARI CRM</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 0,rgba(240,79,135,.15),transparent 28%),#090b14;color:#f7f7fb;font-family:Inter,system-ui,sans-serif}.card{width:min(410px,calc(100vw - 32px));padding:30px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#111522;box-shadow:0 28px 90px rgba(0,0,0,.38)}.mark{width:48px;height:48px}.eyebrow{color:#ffd33d;font-size:10px;font-weight:800;letter-spacing:.15em;margin-top:22px}h1{font-size:28px;margin:9px 0 8px;letter-spacing:-.04em}p{color:#a8adba;font-size:13px;line-height:1.6}.btn{width:100%;height:44px;border-radius:11px;border:1px solid rgba(240,79,135,.34);background:#f04f87;color:white;font-weight:800;cursor:pointer;margin-top:18px}.note{font-size:10px;color:#777e8e;margin-top:16px;text-align:center}</style></head><body><main class="card"><img class="mark" src="./assets/logo.svg" alt="AKARI CRM"><div class="eyebrow">PRIVATE BUSINESS WORKSPACE</div><h1>Welcome to AKARI CRM</h1><p>Sign in through the protected access screen to enter your organisation's isolated CRM workspace.</p><button class="btn" onclick="location.href='./index.html'">Continue to CRM workspace</button><div class="note">CRM access is limited to approved organisation workspaces.</div></main></body></html>

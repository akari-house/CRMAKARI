name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crmakari-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://crm.akarihouse.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and validate
        run: |
          npm install
          npm run validate
      - name: Require Cloudflare deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bad1a0699908ce85470cc9a74c383c9e
        run: |
          npx wrangler pages deploy public \
            --project-name crmakari \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${{ github.event.head_commit.message || 'AKARI CRM production deployment' }}"

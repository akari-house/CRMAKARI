name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crmakari-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://crm.akarihouse.com
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"deployment/cloudflare","description":"Deploying AKARI CRM to Cloudflare Pages","target_url":"https://crm.akarihouse.com"}'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate
        run: |
          npm install
          npm run validate

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Resolve production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          project_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/crmakari"
          project_json="$(curl --fail --silent --show-error "${auth[@]}" "${project_api}")"

          database_id="$(printf '%s' "${project_json}" | jq -r '
            .result.deployment_configs.production.d1_databases as $d
            | if ($d | type) == "object" then
                ($d.DB.id // $d.DB.database_id // empty)
              elif ($d | type) == "array" then
                ($d[]? | select((.binding // .name) == "DB") | (.id // .database_id // empty))
              else empty end
          ' | head -n 1)"

          if [ -z "${database_id}" ]; then
            echo "Pages project binding did not expose the D1 ID; resolving by database name."
            d1_json="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
            database_id="$(printf '%s' "${d1_json}" | jq -r '.result[]? | select(.name == "akari-crm-production") | (.uuid // .id // empty)' | head -n 1)"
          fi

          if [ -z "${database_id}" ]; then
            echo "Could not resolve the production D1 database binding."
            exit 1
          fi

          echo "::add-mask::${database_id}"
          echo "AKARI_D1_DATABASE_ID=${database_id}" >> "${GITHUB_ENV}"
          echo "Resolved the production D1 binding without writing its identifier to the repository."

      - name: Apply pending production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${AKARI_D1_DATABASE_ID}"
          query_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${AKARI_D1_DATABASE_ID}/query"

          apply_migration() {
            file="$1"
            label="$2"
            output="/tmp/${label}.json"
            payload="$(jq -Rs '{sql: .}' "${file}")"
            http_code="$(curl --silent --show-error \
              --output "${output}" \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${query_api}" || true)"

            if [ "${http_code}" -lt 200 ] 2>/dev/null || [ "${http_code}" -ge 300 ] 2>/dev/null; then
              echo "${label} failed with Cloudflare D1 HTTP ${http_code:-unknown}."
              jq '{success,errors,messages}' "${output}" 2>/dev/null || cat "${output}" || true
              exit 1
            fi

            if [ "$(jq -r '.success // false' "${output}")" != "true" ] \
              || [ "$(jq -r '(.errors // []) | length' "${output}")" != "0" ] \
              || [ "$(jq -r '[.result[]? | (.success // true) == false] | any' "${output}")" = "true" ]; then
              echo "${label} returned a D1 migration error."
              jq '{success,errors,messages,result:[.result[]? | {success,error,meta}]}' "${output}"
              exit 1
            fi
            echo "${label} applied."
          }

          apply_migration db/migrations/0003_agreements_compliance.sql r70-migration
          apply_migration db/migrations/0004_founder_onboarding_readiness.sql r71-migration
          apply_migration db/migrations/0005_data_room_diligence.sql r72-migration
          apply_migration db/migrations/0006_relationship_intelligence.sql r73-migration
          apply_migration db/migrations/0007_reporting_attention.sql r74-migration

          verify_payload='{"sql":"SELECT name FROM sqlite_schema WHERE type = '\''table'\'' AND name IN ('\''agreements'\', '\''agreement_reviews'\', '\''founder_onboarding_items'\', '\''fundraising_data_room_requirements'\', '\''relationship_profiles'\', '\''operational_attention'\', '\''operating_report_snapshots'\') ORDER BY name;"}'
          verify_code="$(curl --silent --show-error \
            --output /tmp/schema-check.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${verify_payload}" \
            "${query_api}" || true)"

          if [ "${verify_code}" -lt 200 ] 2>/dev/null || [ "${verify_code}" -ge 300 ] 2>/dev/null; then
            echo "D1 schema verification failed with HTTP ${verify_code:-unknown}."
            jq '{success,errors,messages}' /tmp/schema-check.json 2>/dev/null || cat /tmp/schema-check.json || true
            exit 1
          fi
          if [ "$(jq -r '.success // false' /tmp/schema-check.json)" != "true" ]; then
            echo "D1 schema verification query failed."
            jq '{success,errors,messages}' /tmp/schema-check.json
            exit 1
          fi

          tables="$(jq -r '[.result[]?.results[]?.name] | unique | sort | join(",")' /tmp/schema-check.json)"
          expected="agreement_reviews,agreements,founder_onboarding_items,fundraising_data_room_requirements,operating_report_snapshots,operational_attention,relationship_profiles"
          if [ "${tables}" != "${expected}" ]; then
            echo "Schema verification failed: expected ${expected}; received ${tables:-none}."
            exit 1
          fi
          echo "R70-R74 production D1 schema applied and verified."

      - name: Deploy production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public \
            --project-name crmakari \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "AKARI CRM ${GITHUB_SHA}"

      - name: Ensure production custom domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project="crmakari"
          domain="crm.akarihouse.com"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          domains_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}")"
          attached="$(printf '%s' "${domains_json}" | jq -r --arg domain "${domain}" '.result[]? | select(.name == $domain) | .name' | head -n 1)"
          if [ "${attached}" != "${domain}" ]; then
            echo "Attaching ${domain} to ${project}."
            curl --fail --silent --show-error -X POST "${auth[@]}" --data "{\"name\":\"${domain}\"}" "${api}" >/tmp/cloudflare-domain-create.json
            cat /tmp/cloudflare-domain-create.json
          else
            echo "${domain} is already attached to ${project}."
          fi

          domain_status=""
          for attempt in $(seq 1 30); do
            domain_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/${domain}")"
            domain_status="$(printf '%s' "${domain_json}" | jq -r '.result.status // empty')"
            echo "Custom domain status: ${domain_status:-unknown} (attempt ${attempt}/30)"
            if [ "${domain_status}" = "active" ]; then break; fi
            case "${domain_status}" in
              blocked|deactivated|error) printf '%s\n' "${domain_json}"; exit 1 ;;
            esac
            sleep 10
          done
          if [ "${domain_status}" != "active" ]; then
            echo "${domain} did not become active within the verification window."
            exit 1
          fi

      - name: Verify production URLs
        run: |
          set -euo pipefail
          check_url() {
            url="$1"
            code="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "${url}" || true)"
            echo "${url} returned HTTP ${code}"
            if [ "${code}" = "000" ] || [ "${code}" = "404" ] || [[ "${code}" =~ ^5 ]]; then
              echo "Production URL verification failed for ${url}."
              exit 1
            fi
          }
          check_url "https://crmakari.pages.dev"
          check_url "https://crm.akarihouse.com"

      - name: Mark deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deployment/cloudflare","description":"AKARI CRM deployed and production URLs verified","target_url":"https://crm.akarihouse.com"}'

      - name: Mark deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"deployment/cloudflare","description":"AKARI CRM deployment or URL verification failed","target_url":"https://github.com/'"${GITHUB_REPOSITORY}"'/actions"}'

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crmakari-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://crm.akarihouse.com
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"deployment/cloudflare","description":"Validating and deploying CRM by AKARI","target_url":"https://crm.akarihouse.com"}'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate release candidate
        run: |
          npm install
          npm run validate

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN is not configured."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured."; exit 1; }

      - name: Resolve production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          project_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/crmakari"
          project_json="$(curl --fail --silent --show-error "${auth[@]}" "${project_api}")"
          database_id="$(printf '%s' "${project_json}" | jq -r '
            .result.deployment_configs.production.d1_databases as $d
            | if ($d | type) == "object" then ($d.DB.id // $d.DB.database_id // empty)
              elif ($d | type) == "array" then ($d[]? | select((.binding // .name) == "DB") | (.id // .database_id // empty))
              else empty end' | head -n 1)"
          if [ -z "${database_id}" ]; then
            d1_json="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
            database_id="$(printf '%s' "${d1_json}" | jq -r '.result[]? | select(.name == "akari-crm-production") | (.uuid // .id // empty)' | head -n 1)"
          fi
          test -n "${database_id}" || { echo "Could not resolve production D1 database."; exit 1; }
          echo "::add-mask::${database_id}"
          echo "AKARI_D1_DATABASE_ID=${database_id}" >> "${GITHUB_ENV}"

      - name: Verify Cloudflare D1 authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-d1-preflight.mjs

      - name: Export pre-migration production backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p production-backup
          backup="production-backup/akari-crm-${GITHUB_SHA}.sql"
          npx wrangler d1 export akari-crm-production --remote --output="${backup}" --skip-confirmation
          test -s "${backup}" || { echo "Production D1 backup is empty."; exit 1; }
          sha256sum "${backup}" | tee "${backup}.sha256"
          echo "AKARI_D1_BACKUP_FILE=${backup}" >> "${GITHUB_ENV}"

      - name: Upload pre-migration backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-backup-${{ github.sha }}
          path: production-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Apply and verify production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${AKARI_D1_DATABASE_ID}"
          query_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${AKARI_D1_DATABASE_ID}/query"

          apply_migration() {
            file="$1"; label="$2"; output="/tmp/${label}.json"
            payload="$(jq -Rs '{sql: .}' "${file}")"
            http_code="$(curl --silent --show-error --output "${output}" --write-out '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "${payload}" "${query_api}" || true)"
            if [ "${http_code}" -lt 200 ] 2>/dev/null || [ "${http_code}" -ge 300 ] 2>/dev/null; then
              echo "${label} failed with Cloudflare D1 HTTP ${http_code:-unknown}."
              jq '{success,errors,messages}' "${output}" 2>/dev/null || cat "${output}" || true
              exit 1
            fi
            if [ "$(jq -r '.success // false' "${output}")" != "true" ] \
              || [ "$(jq -r '(.errors // []) | length' "${output}")" != "0" ] \
              || [ "$(jq -r '[.result[]? | (.success // true) == false] | any' "${output}")" = "true" ]; then
              echo "${label} returned a D1 migration error."
              jq '{success,errors,messages,result:[.result[]? | {success,error,meta}]}' "${output}"
              exit 1
            fi
            echo "${label} applied."
          }

          apply_migration db/migrations/0003_agreements_compliance.sql r70-migration
          apply_migration db/migrations/0004_founder_onboarding_readiness.sql r71-migration
          apply_migration db/migrations/0005_data_room_diligence.sql r72-migration
          apply_migration db/migrations/0006_relationship_intelligence.sql r73-migration
          apply_migration db/migrations/0007_reporting_attention.sql r74-migration
          apply_migration db/migrations/0008_saas_workspace_admin.sql r75-migration
          apply_migration db/migrations/0009_essential_integrations.sql r76-migration
          apply_migration db/migrations/0010_house_boundary_bridge.sql r84-migration

          verify_sql="SELECT name FROM sqlite_schema WHERE type = 'table' AND name IN ('agreements','agreement_reviews','founder_onboarding_items','fundraising_data_room_requirements','relationship_profiles','operational_attention','operating_report_snapshots','platform_admins','workspace_usage_snapshots','workspace_integrations','integration_oauth_states','integration_external_refs','external_document_links','workspace_api_keys','webhook_endpoints','webhook_deliveries','external_entity_links','agreement_counterparty_identity') ORDER BY name;"
          verify_payload="$(jq -n --arg sql "${verify_sql}" '{sql:$sql}')"
          verify_code="$(curl --silent --show-error --output /tmp/schema-check.json --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data "${verify_payload}" "${query_api}" || true)"
          if [ "${verify_code}" -lt 200 ] 2>/dev/null || [ "${verify_code}" -ge 300 ] 2>/dev/null; then
            echo "D1 schema verification failed with HTTP ${verify_code:-unknown}."
            jq '{success,errors,messages}' /tmp/schema-check.json 2>/dev/null || cat /tmp/schema-check.json || true
            exit 1
          fi
          test "$(jq -r '.success // false' /tmp/schema-check.json)" = "true" || { jq '{success,errors,messages}' /tmp/schema-check.json; exit 1; }
          tables="$(jq -r '[.result[]?.results[]?.name] | unique | sort | join(",")' /tmp/schema-check.json)"
          expected="agreement_counterparty_identity,agreement_reviews,agreements,external_document_links,external_entity_links,founder_onboarding_items,fundraising_data_room_requirements,integration_external_refs,integration_oauth_states,operating_report_snapshots,operational_attention,platform_admins,relationship_profiles,webhook_deliveries,webhook_endpoints,workspace_api_keys,workspace_integrations,workspace_usage_snapshots"
          test "${tables}" = "${expected}" || { echo "Schema verification failed: expected ${expected}; received ${tables:-none}."; exit 1; }
          echo "R70-R84 production D1 schema applied and verified."

      - name: Generate release metadata
        env:
          AKARI_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/write-release-metadata.mjs

      - name: Deploy production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name crmakari --branch main --commit-hash "${GITHUB_SHA}" --commit-message "CRM by AKARI ${GITHUB_SHA}"

      - name: Ensure production custom domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project="crmakari"; domain="crm.akarihouse.com"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          domains_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}")"
          attached="$(printf '%s' "${domains_json}" | jq -r --arg domain "${domain}" '.result[]? | select(.name == $domain) | .name' | head -n 1)"
          if [ "${attached}" != "${domain}" ]; then
            curl --fail --silent --show-error -X POST "${auth[@]}" --data "{\"name\":\"${domain}\"}" "${api}" >/tmp/cloudflare-domain-create.json
          fi
          domain_status=""
          for attempt in $(seq 1 30); do
            domain_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/${domain}")"
            domain_status="$(printf '%s' "${domain_json}" | jq -r '.result.status // empty')"
            echo "Custom domain status: ${domain_status:-unknown} (attempt ${attempt}/30)"
            [ "${domain_status}" = "active" ] && break
            case "${domain_status}" in blocked|deactivated|error) printf '%s\n' "${domain_json}"; exit 1;; esac
            sleep 10
          done
          test "${domain_status}" = "active" || { echo "${domain} did not become active."; exit 1; }

      - name: Verify production URLs and security headers
        run: |
          set -euo pipefail

          pages_code="$(curl --silent --show-error --max-time 30 --dump-header /tmp/pages-headers.txt --output /dev/null --write-out '%{http_code}' https://crmakari.pages.dev/ || true)"
          echo "https://crmakari.pages.dev returned HTTP ${pages_code}"
          test "${pages_code}" = "200" || { echo "Pages origin is unavailable."; cat /tmp/pages-headers.txt 2>/dev/null || true; exit 1; }
          tr -d '\r' </tmp/pages-headers.txt >/tmp/pages-headers-normalized.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/pages-headers-normalized.txt || { echo "Pages origin is missing nosniff."; exit 1; }
          grep -qi '^x-frame-options: DENY' /tmp/pages-headers-normalized.txt || { echo "Pages origin is missing frame deny."; exit 1; }
          grep -Eqi "^content-security-policy:.*frame-ancestors 'none'" /tmp/pages-headers-normalized.txt || { echo "Pages origin is missing frame-ancestors CSP."; exit 1; }

          custom_code="$(curl --silent --show-error --max-time 30 --dump-header /tmp/custom-headers.txt --output /dev/null --write-out '%{http_code}' https://crm.akarihouse.com/ || true)"
          echo "https://crm.akarihouse.com returned HTTP ${custom_code}"
          tr -d '\r' </tmp/custom-headers.txt >/tmp/custom-headers-normalized.txt
          case "${custom_code}" in 301|302|303|307|308|401|403) ;; *) echo "Custom domain did not fail closed behind Cloudflare Access."; cat /tmp/custom-headers-normalized.txt; exit 1;; esac
          if ! grep -qi '^www-authenticate: Cloudflare-Access' /tmp/custom-headers-normalized.txt \
            && ! grep -Eqi '^location: https://[^/]+\.cloudflareaccess\.com/' /tmp/custom-headers-normalized.txt; then
            echo "Custom domain response does not contain Cloudflare Access challenge evidence."
            cat /tmp/custom-headers-normalized.txt
            exit 1
          fi

          protected_code="$(curl --silent --show-error --max-time 30 --dump-header /tmp/health-headers.txt --output /dev/null --write-out '%{http_code}' https://crm.akarihouse.com/api/system-health || true)"
          case "${protected_code}" in 301|302|303|307|308|401|403) ;; *) echo "Unexpected protected health response ${protected_code}."; exit 1;; esac
          tr -d '\r' </tmp/health-headers.txt >/tmp/health-headers-normalized.txt
          if ! grep -qi '^www-authenticate: Cloudflare-Access' /tmp/health-headers-normalized.txt \
            && ! grep -Eqi '^location: https://[^/]+\.cloudflareaccess\.com/' /tmp/health-headers-normalized.txt; then
            echo "Protected health endpoint did not present Cloudflare Access challenge evidence."
            exit 1
          fi
          echo "Cloudflare Access edge and Pages application security headers verified."

      - name: Run V1 production acceptance gate
        env:
          AKARI_BASE_URL: https://crm.akarihouse.com
          AKARI_PAGES_URL: https://crmakari.pages.dev
          AKARI_EXPECTED_SHA: ${{ github.sha }}
          AKARI_ACCEPTANCE_REPORT: production-acceptance-report.json
        run: node scripts/production-acceptance.mjs

      - name: Upload production acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ github.sha }}
          path: production-acceptance-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Mark deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deployment/cloudflare","description":"CRM by AKARI deployed, schema and production acceptance passed","target_url":"https://crm.akarihouse.com"}'

      - name: Mark deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"deployment/cloudflare","description":"CRM by AKARI deployment gate failed","target_url":"https://github.com/'"${GITHUB_REPOSITORY}"'/actions"}'

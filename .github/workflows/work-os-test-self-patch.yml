name: Work OS test self patch

on:
  push:
    branches: [build/work-os-calendar-r7]
    paths: [.github/workflows/work-os-test-self-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/work-os-calendar-r7
          fetch-depth: 0
      - name: Patch calendar fixtures and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          test_path = Path('tests/work-os.spec.js')
          test_source = test_path.read_text()
          if '2030-' not in test_source:
              raise SystemExit('Expected 2030 calendar fixtures were not found')
          test_path.write_text(test_source.replace('2030-', '2026-'))

          client_path = Path('public/assets/work-os-v1.js')
          client_source = client_path.read_text()
          before = "'\"':'&quot'"
          after = "'\"':'&quot;'"
          if client_source.count(before) != 1:
              raise SystemExit('Expected Work OS escape-map occurrence was not found')
          client_path.write_text(client_source.replace(before, after))

          Path('.github/workflows/work-os-test-self-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/work-os.spec.js public/assets/work-os-v1.js .github/workflows/work-os-test-self-patch.yml
          git commit -m "Fix Work OS calendar fixtures and escaping"
          git push origin HEAD:build/work-os-calendar-r7

name: Canonical My Day self patch

on:
  push:
    branches: [fix/canonical-my-day-dnd-r8]
    paths: [.github/workflows/canonical-my-day-self-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-my-day-dnd-r8
          fetch-depth: 0
      - name: Remove legacy My Day and harden drag and drop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, before, after, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              p.write_text(source.replace(before, after, 1))

          def regex_once(path, pattern, replacement, label, flags=0):
              p = Path(path)
              source = p.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              p.write_text(updated)

          crm_path = Path('public/assets/crm.js')
          crm = crm_path.read_text()
          canonical_day = '''async function renderMyDay() {
            $('#view-root').innerHTML = `
              ${pageHead('TEAM EXECUTION', 'My Day', 'Tasks, ownership, deadlines and connected work in one operating view.')}
              <section id="work-os-root" class="work-os work-os-loading" aria-live="polite" aria-busy="true">
                <div class="work-os-loading-card"><span>TEAM WORK OS</span><strong>Loading tasks and calendar…</strong><p>Opening the canonical execution workspace.</p></div>
              </section>`;
          }

          async function renderFlows'''
          crm, count = re.subn(
              r"async function renderMyDay\(force = false\) \{.*?\n\}\n\nasync function renderFlows",
              canonical_day,
              crm,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'canonical My Day replacement: expected one match, found {count}')
          crm_path.write_text(crm)

          work_path = Path('public/assets/work-os-v1.js')
          lines = work_path.read_text().splitlines()

          def replace_line(prefix, replacement):
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'{prefix}: expected one line, found {len(matches)}')
              lines[matches[0]] = replacement

          replace_line(
              "const state=",
              "const state={payload:null,view:'board',scope:'mine',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),project:'',owner:'',workstream:'',loading:false,renderKey:'',dragTaskId:'',pointerDrag:null};",
          )
          replace_line(
              'function taskCard(task)',
              "function taskCard(task){return `<article class=\"work-card\" draggable=\"true\" data-work-task=\"${esc(task.id)}\" data-status=\"${esc(task.status)}\" tabindex=\"0\" aria-grabbed=\"false\"><button type=\"button\" class=\"work-card__drag\" draggable=\"true\" data-work-drag-handle data-id=\"${esc(task.id)}\" aria-label=\"Drag ${esc(task.title)}\">⋮⋮</button><div class=\"work-card__top\"><span class=\"${priorityClass(task.priority)}\">${esc(title(task.priority))}</span><span class=\"work-stream\">${esc(title(task.workstream))}</span></div><button class=\"work-card__title\" data-work-action=\"open-task\" data-id=\"${esc(task.id)}\">${esc(task.title)}</button><p>${esc(relationLabel(task))}</p><div class=\"work-card__foot\"><span>${esc(task.ownerName||'Unassigned')}</span><time class=\"${isOverdue(task)?'is-overdue':''}\">${esc(dateLabel(task.dueAt))}</time></div></article>`;}",
          )
          replace_line(
              'function boardView(tasks)',
              "function boardView(tasks){const columns=[['TODO','To do','Ready to start'],['IN_PROGRESS','In progress','Work underway'],['WAITING','Waiting','Awaiting input'],['DONE','Done','Recently completed']];return `<div class=\"work-board\">${columns.map(([status,label,hint])=>{const rows=tasks.filter(task=>task.status===status);return `<section class=\"work-column\" data-work-drop-status=\"${status}\"><header><div><strong>${label}</strong><span>${hint}</span></div><b>${rows.length}</b></header><div class=\"work-column__body\" data-work-drop-status=\"${status}\">${rows.length?rows.map(taskCard).join(''):'<div class=\"work-empty-drop\">Drop a task here</div>'}</div></section>`;}).join('')}</div>`;}",
          )
          replace_line(
              'function renderMyDay()',
              "function renderMyDay(){const pageHead=$('#view-root .page-head');if(!pageHead||!state.payload)return;document.body.classList.add('work-os-active');const roots=$$('#view-root #work-os-root');let root=roots.shift();roots.forEach(node=>node.remove());if(!root){root=document.createElement('section');root.id='work-os-root';pageHead.insertAdjacentElement('afterend',root);}root.className='work-os';root.setAttribute('aria-live','polite');root.setAttribute('aria-busy','false');const tasks=filteredTasks();root.innerHTML=`<section class=\"work-quick\"><form id=\"work-quick-form\"><div class=\"work-quick__title\"><span>QUICK TASK</span><input name=\"title\" required placeholder=\"Create announcement design, follow up investor, prepare quote…\" autocomplete=\"off\"/></div><select name=\"ownerUserId\" aria-label=\"Owner\">${memberOptions('')}</select><input name=\"dueAt\" type=\"datetime-local\" aria-label=\"Due date and time\"/><select name=\"projectId\" aria-label=\"Project relation\">${projectOptions('')}</select><select name=\"workstream\" aria-label=\"Workstream\">${streamOptions('GENERAL')}</select><button class=\"btn primary\" type=\"submit\">Add task</button></form></section>${metricCards(tasks)}<section class=\"work-command\"><header><div><span>TEAM WORK OS</span><h2>Tasks, relations and calendar</h2><p>Every task remains tenant-scoped and can stay related to its project, opportunity or delivery workspace.</p></div><div class=\"work-view-tabs\">${[['board','Board'],['list','List'],['calendar','Calendar'],['agenda','Agenda']].map(([key,label])=>`<button class=\"${state.view===key?'active':''}\" data-work-action=\"view\" data-view=\"${key}\">${label}</button>`).join('')}</div></header><div class=\"work-filters\"><select data-work-filter=\"scope\"><option value=\"mine\" ${state.scope==='mine'?'selected':''}>My work</option><option value=\"team\" ${state.scope==='team'?'selected':''}>Team work</option></select><select data-work-filter=\"project\"><option value=\"\">All projects</option>${options(state.payload.projects||[],'id','name',state.project)}</select><select data-work-filter=\"owner\"><option value=\"\">All owners</option>${(state.payload.members||[]).map(member=>`<option value=\"${esc(member.id)}\" ${member.id===state.owner?'selected':''}>${esc(member.fullName)}</option>`).join('')}</select><select data-work-filter=\"workstream\"><option value=\"\">All workstreams</option>${streams.map(item=>`<option value=\"${item}\" ${item===state.workstream?'selected':''}>${title(item)}</option>`).join('')}</select><button class=\"btn small\" data-work-action=\"refresh\">Refresh</button></div><div id=\"work-view-root\">${viewHtml()}</div></section>${automationHtml()}`;}",
          )

          drag_start = next(i for i, line in enumerate(lines) if line.startswith("document.addEventListener('dragstart'"))
          drag_end = next(i for i, line in enumerate(lines) if line.startswith("document.addEventListener('drop'"))
          drag_block = '''function clearDropState(){document.body.classList.remove('work-is-dragging');$$('.is-drop-target').forEach(node=>node.classList.remove('is-drop-target'));$$('.is-dragging').forEach(node=>{node.classList.remove('is-dragging');node.setAttribute?.('aria-grabbed','false');});}
          function transferredTaskId(event){return event.dataTransfer?.getData('text/work-task')||event.dataTransfer?.getData('text/plain')||state.dragTaskId||state.pointerDrag?.taskId||'';}
          function applyTaskPatch(taskId,patch){const task=(state.payload?.tasks||[]).find(item=>item.id===taskId);if(!task)return()=>{};const before={status:task.status,dueAt:task.dueAt};const event=(state.payload?.calendarEvents||[]).find(item=>item.type==='TASK'&&item.sourceId===taskId);const eventBefore=event?{status:event.status,startsAt:event.startsAt,date:event.date}:null;if(Object.prototype.hasOwnProperty.call(patch,'status')){task.status=patch.status;if(event)event.status=patch.status;}if(Object.prototype.hasOwnProperty.call(patch,'dueAt')){task.dueAt=patch.dueAt;if(event){event.startsAt=patch.dueAt;event.date=dayKey(patch.dueAt);}}return()=>{Object.assign(task,before);if(event&&eventBefore)Object.assign(event,eventBefore);};}
          async function persistTaskDrop(taskId,patch,message){const restore=applyTaskPatch(taskId,patch);renderMyDay();try{await api('/api/work-os',{method:'POST',body:JSON.stringify({action:'update-task',taskId,...patch})});notify(message);await refresh();}catch(error){restore();renderMyDay();notify(error.message||'Task move failed','error');}}
          document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-work-task]');const calendarTask=event.target.closest('.work-event[data-source-id][data-event-type="TASK"]');const taskId=card?.dataset.workTask||calendarTask?.dataset.sourceId||'';if(!taskId)return;state.dragTaskId=taskId;event.dataTransfer?.setData('text/work-task',taskId);event.dataTransfer?.setData('text/plain',taskId);if(event.dataTransfer)event.dataTransfer.effectAllowed='move';card?.classList.add('is-dragging');card?.setAttribute('aria-grabbed','true');calendarTask?.classList.add('is-dragging');document.body.classList.add('work-is-dragging');},true);
          document.addEventListener('dragover',event=>{const target=event.target.closest('[data-work-drop-status],[data-work-drop-date]');if(!target||!transferredTaskId(event))return;event.preventDefault();if(event.dataTransfer)event.dataTransfer.dropEffect='move';$$('.is-drop-target').forEach(node=>node.classList.remove('is-drop-target'));target.classList.add('is-drop-target');},true);
          document.addEventListener('dragleave',event=>{const target=event.target.closest('[data-work-drop-status],[data-work-drop-date]');if(target&&!target.contains(event.relatedTarget))target.classList.remove('is-drop-target');},true);
          document.addEventListener('drop',async event=>{const target=event.target.closest('[data-work-drop-status],[data-work-drop-date]');const taskId=transferredTaskId(event);if(!target||!taskId)return;event.preventDefault();clearDropState();state.dragTaskId='';if(target.dataset.workDropStatus)await persistTaskDrop(taskId,{status:target.dataset.workDropStatus},`Task moved to ${title(target.dataset.workDropStatus)}`);else if(target.dataset.workDropDate)await persistTaskDrop(taskId,{dueAt:`${target.dataset.workDropDate}T16:00:00.000Z`},`Task rescheduled to ${dateLabel(target.dataset.workDropDate,false)}`);},true);
          document.addEventListener('dragend',()=>{state.dragTaskId='';clearDropState();},true);
          document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-work-drag-handle]');if(!handle||event.pointerType==='mouse')return;const card=handle.closest('[data-work-task]');if(!card)return;event.preventDefault();state.pointerDrag={taskId:card.dataset.workTask,pointerId:event.pointerId};card.classList.add('is-dragging');card.setAttribute('aria-grabbed','true');document.body.classList.add('work-is-dragging');handle.setPointerCapture?.(event.pointerId);},true);
          document.addEventListener('pointermove',event=>{if(!state.pointerDrag||state.pointerDrag.pointerId!==event.pointerId)return;event.preventDefault();const target=document.elementFromPoint(event.clientX,event.clientY)?.closest?.('[data-work-drop-status]');$$('.is-drop-target').forEach(node=>node.classList.remove('is-drop-target'));target?.classList.add('is-drop-target');},true);
          document.addEventListener('pointerup',async event=>{if(!state.pointerDrag||state.pointerDrag.pointerId!==event.pointerId)return;const taskId=state.pointerDrag.taskId;const target=document.elementFromPoint(event.clientX,event.clientY)?.closest?.('[data-work-drop-status]');state.pointerDrag=null;clearDropState();if(target)await persistTaskDrop(taskId,{status:target.dataset.workDropStatus},`Task moved to ${title(target.dataset.workDropStatus)}`);},true);
          document.addEventListener('pointercancel',()=>{state.pointerDrag=null;clearDropState();},true);'''.splitlines()
          lines[drag_start:drag_end+1] = drag_block
          work_path.write_text('\n'.join(lines) + '\n')

          css_path = Path('public/assets/work-os-fixes-v1.css')
          css = css_path.read_text().rstrip() + '''

/* Canonical My Day loading state and Jira-style drag feedback. */
.work-os-loading{min-height:320px;display:grid;place-items:center}
.work-os-loading-card{width:min(520px,100%);display:grid;gap:8px;padding:28px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(8,11,16,.9);text-align:center}
.work-os-loading-card span{font-size:10px;letter-spacing:.14em;font-weight:800;color:#ffad62}
.work-os-loading-card strong{font-size:20px;color:#f6f7fa}
.work-os-loading-card p{margin:0;color:#7f8a9b}
.work-card{cursor:grab;will-change:transform,opacity}
.work-card:active,.work-card.is-dragging{cursor:grabbing}
.work-card__drag{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:7px;background:transparent;color:#697487;padding:4px 6px;line-height:1;cursor:grab;touch-action:none}
.work-card__drag:hover,.work-card__drag:focus-visible{background:#1a2230;color:#fff;outline:none}
.work-card.is-dragging,.work-event.is-dragging{opacity:.38;transform:rotate(1deg) scale(.985)}
.work-column.is-drop-target,.work-column__body.is-drop-target{border-color:rgba(255,156,69,.7)!important;background:rgba(255,156,69,.08)!important;box-shadow:inset 0 0 0 2px rgba(255,156,69,.18)}
.work-day.is-drop-target{background:rgba(255,156,69,.12)!important;box-shadow:inset 0 0 0 2px rgba(255,156,69,.55)!important}
body.work-is-dragging .work-column__body,body.work-is-dragging .work-day{transition:background .14s ease,border-color .14s ease,box-shadow .14s ease}
@media (pointer:coarse){.work-card__drag{padding:8px;font-size:18px}.work-card{cursor:default}}
'''
          css_path.write_text(css)

          test_path = Path('tests/work-os.spec.js')
          tests = test_path.read_text()
          anchor = "test('Work OS provides fast creation, editable relations and four execution views', async ({ page }) => {"
          new_test = '''test('My Day has one canonical Work OS and drag moves tasks between columns', async ({ page }) => {
            await expect(page.locator('#work-os-root')).toHaveCount(1);
            await expect(page.locator('.task-board-panel')).toHaveCount(0);
            const handle = page.locator('[data-work-task="tsk_work_1"] [data-work-drag-handle]');
            const target = page.locator('[data-work-drop-status="IN_PROGRESS"] .work-column__body');
            await handle.dragTo(target);
            await expect.poll(() => actions.some((action) => action.action === 'update-task' && action.taskId === 'tsk_work_1' && action.status === 'IN_PROGRESS')).toBeTruthy();
          });

          ''' + anchor
          if tests.count(anchor) != 1:
              raise SystemExit('Work OS browser test anchor not found')
          test_path.write_text(tests.replace(anchor, new_test, 1))

          validate_path = Path('scripts/validate-work-os.mjs')
          validate = validate_path.read_text()
          validate = validate.replace("'data-work-drop-date'", "'data-work-drop-date', 'data-work-drag-handle'")
          validate = validate.replace("['/assets/work-os-v1.css?v=1', '/assets/work-os-v1.js?v=1']", "['/assets/work-os-v1.css?v=1', '/assets/work-os-v1.js?v=2', '/assets/work-os-fixes-v1.css?v=2']")
          validate_path.write_text(validate)

          html_path = Path('public/app/index.html')
          html = html_path.read_text()
          html = html.replace('/assets/crm.js?v=22', '/assets/crm.js?v=23')
          html = html.replace('/assets/work-os-fixes-v1.css?v=1', '/assets/work-os-fixes-v1.css?v=2')
          html = html.replace('/assets/work-os-v1.js?v=1', '/assets/work-os-v1.js?v=2')
          html_path.write_text(html)

          sw_path = Path('public/sw.js')
          sw = sw_path.read_text()
          sw = sw.replace("akari-crm-shell-v36", "akari-crm-shell-v37")
          sw = sw.replace("runtime=v36", "runtime=v37")
          sw = sw.replace("./assets/crm.js?v=22", "./assets/crm.js?v=23")
          sw = sw.replace("./assets/work-os-fixes-v1.css?v=1", "./assets/work-os-fixes-v1.css?v=2")
          sw = sw.replace("./assets/work-os-v1.js?v=1", "./assets/work-os-v1.js?v=2")
          sw_path.write_text(sw)

          Path('.github/workflows/canonical-my-day-self-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/crm.js public/assets/work-os-v1.js public/assets/work-os-fixes-v1.css public/app/index.html public/sw.js tests/work-os.spec.js scripts/validate-work-os.mjs .github/workflows/canonical-my-day-self-patch.yml
          git commit -m "Make My Day canonical and harden drag and drop"
          git push origin HEAD:fix/canonical-my-day-dnd-r8

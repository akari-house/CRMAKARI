name: Post-Deploy Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected CRM endpoints
        shell: bash
        env:
          ACCESS_AUD: c588ec31c2f28826d192548846f060dd7fa9355b3bd20ddff59600c5d3596eaf
        run: |
          set -euo pipefail

          check_access_redirect() {
            url="$1"
            expected_host="$2"
            headers=$(mktemp)

            status=$(curl --silent --show-error \
              --max-time 30 \
              --header 'Accept: text/html' \
              --dump-header "$headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$url")

            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print substr($0, index($0,$2))}' "$headers" | tail -n 1)

            echo "$url returned HTTP $status"
            echo "Redirect location: $location"

            test "$status" = "302"
            printf '%s' "$location" | grep -q "cloudflareaccess.com/cdn-cgi/access/login/${expected_host}"
            printf '%s' "$location" | grep -q "kid=${ACCESS_AUD}"
          }

          check_access_redirect "https://crmakari.pages.dev/" "crmakari.pages.dev"
          check_access_redirect "https://crm.akarihouse.com/" "crm.akarihouse.com"

          echo "Both AKARI CRM browser endpoints redirect with the configured Access audience."

      - name: Mark deployment smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"deployment/smoke","description":"AKARI CRM browser login redirect is healthy","target_url":"https://crm.akarihouse.com"}'

      - name: Mark deployment smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"deployment/smoke","description":"AKARI CRM browser login redirect failed","target_url":"https://crm.akarihouse.com"}'

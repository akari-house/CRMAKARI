name: Post-Deploy Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Pages frontend
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location \
            --max-time 30 \
            --dump-header /tmp/crmakari-headers.txt \
            --output /tmp/crmakari-body.html \
            --write-out '%{http_code}' \
            https://crmakari.pages.dev/)
          echo "HTTP status: ${status}"
          echo "--- response headers ---"
          cat /tmp/crmakari-headers.txt
          echo "--- response body preview ---"
          head -c 4000 /tmp/crmakari-body.html || true
          echo
          test "${status}" -ge 200
          test "${status}" -lt 400
          grep -q "AKARI CRM" /tmp/crmakari-body.html

      - name: Mark deployment smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"deployment/smoke","description":"AKARI CRM frontend is live","target_url":"https://crmakari.pages.dev"}'

      - name: Mark deployment smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"deployment/smoke","description":"AKARI CRM frontend smoke check failed","target_url":"https://crmakari.pages.dev"}'

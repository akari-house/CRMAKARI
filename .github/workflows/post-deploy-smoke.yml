name: Post-Deploy Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 60

      - name: Verify Pages frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors \
            --max-time 30 \
            https://crmakari.pages.dev/ \
            --output /tmp/crmakari-index.html
          grep -q "AKARI CRM" /tmp/crmakari-index.html
          echo "AKARI CRM frontend is reachable on crmakari.pages.dev"

      - name: Mark deployment smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"deployment/smoke","description":"AKARI CRM frontend is live","target_url":"https://crmakari.pages.dev"}'

      - name: Mark deployment smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"deployment/smoke","description":"AKARI CRM frontend smoke check failed","target_url":"https://crmakari.pages.dev"}'

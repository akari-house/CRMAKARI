name: Post-Deploy Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected CRM endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_access_protection() {
            url="$1"
            expected_host="$2"
            headers=$(mktemp)

            status=$(curl --silent --show-error \
              --max-time 30 \
              --dump-header "$headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$url")

            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print substr($0, index($0,$2))}' "$headers" | tail -n 1)

            echo "$url returned HTTP $status"
            echo "Redirect location: $location"

            if [ "$status" = "401" ]; then
              echo "$url is protected by Cloudflare Access with an authentication challenge."
              return 0
            fi

            if [ "$status" = "302" ]; then
              printf '%s' "$location" | grep -q "cloudflareaccess.com/cdn-cgi/access/login/${expected_host}"
              return 0
            fi

            echo "Expected Cloudflare Access 401 or login redirect, received HTTP $status"
            return 1
          }

          check_access_protection "https://crmakari.pages.dev/" "crmakari.pages.dev"
          check_access_protection "https://crm.akarihouse.com/" "crm.akarihouse.com"

          echo "Both AKARI CRM endpoints are reachable and protected by Cloudflare Access."

      - name: Mark deployment smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"deployment/smoke","description":"AKARI CRM endpoints are live and Access-protected","target_url":"https://crm.akarihouse.com"}'

      - name: Mark deployment smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"deployment/smoke","description":"AKARI CRM endpoint smoke check failed","target_url":"https://crm.akarihouse.com"}'

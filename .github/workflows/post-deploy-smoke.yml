name: Post-Deploy Smoke

on:
  workflow_run:
    workflows: [Deploy Cloudflare Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify public homepage and protected CRM boundary
        shell: bash
        env:
          ACCESS_AUD: c588ec31c2f28826d192548846f060dd7fa9355b3bd20ddff59600c5d3596eaf
        run: |
          set -euo pipefail

          check_public_home() {
            url="$1"
            body=$(mktemp)
            script=$(mktemp)
            status=$(curl --silent --show-error --max-time 30 --header 'Accept: text/html' --output "$body" --write-out '%{http_code}' "$url")
            echo "$url returned HTTP $status"
            test "$status" = "200"
            grep -q '<title>CRM by AKARI' "$body"
            grep -Eq 'href="#waitlist"' "$body"
            grep -q '/assets/public-home-r6.js' "$body"

            asset_url="${url%/}/assets/public-home-r6.js?v=9"
            asset_status=$(curl --silent --show-error --max-time 30 --header 'Accept: application/javascript' --output "$script" --write-out '%{http_code}' "$asset_url")
            echo "$asset_url returned HTTP $asset_status"
            test "$asset_status" = "200"
            grep -q 'Private CRM · Invite only' "$script"
            grep -q 'querySelectorAll' "$script"
            grep -q 'public-home-r6-core.js' "$script"
          }

          validate_access_location() {
            location="$1"
            expected_host="$2"
            printf '%s' "$location" | grep -Eq "^https://[^/]*cloudflareaccess\.com/cdn-cgi/access/login/${expected_host}(\?|$)"
            printf '%s' "$location" | grep -Eq "[?&]kid=${ACCESS_AUD}([&#]|$)"
            printf '%s' "$location" | grep -Eq '[?&]redirect_url='
          }

          check_access_redirect() {
            url="$1"
            expected_host="$2"
            headers=$(mktemp)
            status=$(curl --silent --show-error --max-time 30 --header 'Accept: text/html' --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url")
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print substr($0, index($0,$2))}' "$headers" | tail -n 1)
            echo "$url returned HTTP $status"
            echo "Redirect location: $location"
            case "$status" in
              301|302|303|307|308) ;;
              *) echo "Expected an Access redirect, received HTTP $status" >&2; exit 1 ;;
            esac
            validate_access_location "$location" "$expected_host"
          }

          check_api_auth_boundary() {
            url="$1"
            expected_host="$2"
            body=$(mktemp)
            headers=$(mktemp)
            status=$(curl --silent --show-error --max-time 30 --header 'Accept: application/json' --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")
            echo "$url returned HTTP $status"

            case "$status" in
              401)
                grep -q 'Authentication required' "$body"
                echo "API protection confirmed by application authentication boundary."
                ;;
              301|302|303|307|308)
                location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print substr($0, index($0,$2))}' "$headers" | tail -n 1)
                echo "API redirect location: $location"
                validate_access_location "$location" "$expected_host"
                echo "API protection confirmed by Cloudflare Access edge."
                ;;
              *)
                echo "Expected HTTP 401 or a verified Access redirect, received HTTP $status" >&2
                cat "$body" >&2
                exit 1
                ;;
            esac
          }

          check_public_home "https://crmakari.pages.dev/"
          check_public_home "https://crm.akarihouse.com/"
          check_access_redirect "https://crmakari.pages.dev/app/" "crmakari.pages.dev"
          check_access_redirect "https://crm.akarihouse.com/app/" "crm.akarihouse.com"
          check_api_auth_boundary "https://crmakari.pages.dev/api/akari-leads?limit=1&offset=0" "crmakari.pages.dev"
          check_api_auth_boundary "https://crm.akarihouse.com/api/akari-leads?limit=1&offset=0" "crm.akarihouse.com"

          echo "Public invite-only homepage and protected CRM boundaries are healthy."

      - name: Mark deployment smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"success","context":"deployment/smoke","description":"Public invite-only entry and protected CRM boundary are healthy","target_url":"https://crm.akarihouse.com"}'

      - name: Mark deployment smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"failure","context":"deployment/smoke","description":"Public entry or protected CRM boundary failed","target_url":"https://crm.akarihouse.com"}'

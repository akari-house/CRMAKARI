name: Generate V1 Dependency Lockfile

on:
  push:
    branches: [hardening/dependency-lock-v1]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.head_commit.message != 'chore: generate V1 package lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/dependency-lock-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Generate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit deterministic lockfile
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "chore: generate V1 package lock"
          git push origin HEAD:hardening/dependency-lock-v1

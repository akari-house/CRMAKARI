name: UI Acceptance (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

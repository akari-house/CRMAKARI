name: UI Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        run: |
          npm install
          npm run validate
      - name: Install Playwright Chromium
        run: npx --yes @playwright/test@1.54.2 install --with-deps chromium
      - name: Click-test production UI
        run: npx --yes @playwright/test@1.54.2 test
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

name: Work OS UI self patch

on:
  push:
    branches: [build/work-os-calendar-r7]
    paths: [.github/workflows/work-os-ui-self-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/work-os-calendar-r7
          fetch-depth: 0
      - name: Patch responsive controls and browser regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              p.write_text(source.replace(before, after, 1))

          replace_once(
              'public/assets/work-os-v1.css',
              '.work-quick form select:nth-of-type(3),.work-quick form select:nth-of-type(4){display:none}',
              '',
              'responsive quick-task controls',
          )
          replace_once(
              'public/assets/commercial-hardening-v3.js',
              '      existing?.remove();',
              "      document.querySelectorAll('#commercial-command-centre').forEach((node) => node.remove());",
              'commercial command centre cleanup',
          )
          replace_once(
              'public/assets/commercial-finance-v3-fix.js',
              "      $('#commercial-command-centre')?.remove();",
              "      document.querySelectorAll('#commercial-command-centre').forEach((node) => node.remove());",
              'finance command centre cleanup',
          )

          ui_path = Path('tests/ui.spec.js')
          ui = ui_path.read_text()
          fixture_anchor = "  '/api/projects?limit=5':"
          fixture = """  '/api/work-os?scope=mine': {
    scope: 'mine',
    tasks: [{ id: 'tsk_1', title: 'Follow up Project Alpha', description: 'Prepare the next action.', ownerUserId: 'usr_test', ownerName: 'Muaz Test', status: 'TODO', priority: 'HIGH', dueAt: '2030-01-01T12:00:00Z', projectId: 'prj_1', projectName: 'Project Alpha', workstream: 'BD', showOnHome: true }],
    members: [{ id: 'usr_test', fullName: 'Muaz Test', email: 'owner@example.com', role: 'OWNER' }],
    projects: [{ id: 'prj_1', name: 'Project Alpha', ownerUserId: 'usr_test', lifecycleStatus: 'LEAD' }],
    opportunities: [], campaigns: [], calendarEvents: [], partnershipCandidates: [], fundraisingPlans: [],
    permissions: { canWrite: true, canManage: true, canFinance: true },
  },
"""
          if "'/api/work-os?scope=mine'" not in ui:
              if fixture_anchor not in ui:
                  raise SystemExit('UI fixture anchor not found')
              ui = ui.replace(fixture_anchor, fixture + fixture_anchor, 1)

          old_drag = """  const todoCard=page.locator('[data-task-card=\"tsk_1\"]');
  await expect(todoCard).toBeVisible();
  await todoCard.dragTo(page.locator('[data-task-column=\"IN_PROGRESS\"] .task-board-dropzone'));
  await expect(page.locator('[data-task-column=\"IN_PROGRESS\"] [data-task-card=\"tsk_1\"]')).toBeVisible();
  await expect(page.getByText('Task moved to In Progress')).toBeVisible();"""
          new_task = """  await expect(page.locator('#work-os-root')).toBeVisible();
  await page.getByRole('button', { name: 'Follow up Project Alpha', exact: true }).click();
  await expect(page.getByRole('dialog', { name: 'Task details' })).toBeVisible();
  await page.locator('#work-task-form select[name=\"status\"]').selectOption('IN_PROGRESS');
  await page.locator('#work-task-form').getByRole('button', { name: 'Save task' }).click();
  await expect(page.getByText('Work OS updated')).toBeVisible();"""
          if old_drag not in ui:
              raise SystemExit('Legacy task drag assertion block not found')
          ui_path.write_text(ui.replace(old_drag, new_task, 1))

          work_path = Path('tests/work-os.spec.js')
          work = work_path.read_text()
          old_heading = "await expect(page.getByRole('heading', { name: 'Project Alpha' })).toBeVisible();"
          new_heading = "await expect(page.locator('#work-os-modal-root').getByRole('heading', { name: 'Project Alpha' })).toBeVisible();"
          count = work.count(old_heading)
          if count != 2:
              raise SystemExit(f'Expected two ambiguous modal heading assertions, found {count}')
          work_path.write_text(work.replace(old_heading, new_heading))

          Path('.github/workflows/work-os-ui-self-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/work-os-v1.css public/assets/commercial-hardening-v3.js public/assets/commercial-finance-v3-fix.js tests/ui.spec.js tests/work-os.spec.js .github/workflows/work-os-ui-self-patch.yml
          git commit -m "Fix Work OS responsive controls and browser acceptance"
          git push origin HEAD:build/work-os-calendar-r7

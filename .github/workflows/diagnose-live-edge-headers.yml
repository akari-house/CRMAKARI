name: Diagnose live edge headers

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-edge-headers.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GET and HEAD response headers
        run: |
          set -euo pipefail
          for url in \
            https://crm.akarihouse.com/ \
            https://crmakari.pages.dev/ \
            https://fad12692.crmakari.pages.dev/
          do
            echo "===== GET ${url} ====="
            curl --silent --show-error --max-time 30 --dump-header - --output /dev/null "${url}" | tr -d '\r'
            echo "===== HEAD ${url} ====="
            curl --silent --show-error --max-time 30 --head "${url}" | tr -d '\r'
            echo
          done
